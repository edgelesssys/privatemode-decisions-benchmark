name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # The metrics are the claim, and they need no keys. The library is
      # installed for the parity tests between its calibration code and ours,
      # pinned to the head commit of its calibration PR (as the privatemode
      # extra) until that is merged; switch both to main then.
      - run: pip install pytest numpy "privatemode-decisions @ git+https://github.com/edgelesssys/privatemode-decisions@ae35442fc59e65d0b1a4dcc70e7f35187358dc3e"
      - run: python -m pytest -q tests
      - run: python -m compileall -q bench
