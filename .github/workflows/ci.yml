name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # The metrics are the claim, and they need no keys. The library is
      # installed for the parity tests between its calibration code and ours,
      # pinned to its calibration branch until that is merged (as the
      # privatemode extra); switch both back to main then.
      - run: pip install pytest numpy "privatemode-decisions @ git+https://github.com/edgelesssys/privatemode-decisions@calibration"
      - run: python -m pytest -q tests
      - run: python -m compileall -q bench
