name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # The metrics are the claim, and they need no keys. The library is
      # installed for the parity tests between its calibration code and ours,
      # pinned to its calibration commit on main (as the privatemode extra).
      - run: pip install pytest numpy "privatemode-decisions @ git+https://github.com/edgelesssys/privatemode-decisions@a9f94ef5d3dc2def1fd2c17441164cf9cea2a251"
      - run: python -m pytest -q tests
      - run: python -m compileall -q bench
