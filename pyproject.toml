[project]
name = "privatemode-decisions-benchmark"
version = "0.1.0"
description = "Speed, accuracy and cost of Privatemode Decisions, TypeSafe Jev and Laya on labelled public datasets"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
# Deliberately no runtime dependencies: the datasets come over plain HTTP and
# every metric is computed here, so a run needs nothing but the arms it uses.
dependencies = []

[project.optional-dependencies]
# The Privatemode arm measures the library that actually ships, rather than a
# reimplementation of it. To change the library alongside, clone it next to
# this one and `pip install -e ../privatemode-decisions` instead.
# Pinned to the library's commit with two automation sequences (the arm
# needs its temperature= and optimize=, the parity tests the sequences),
# with CI and the README. A commit, not a branch: branches move.
privatemode = ["privatemode-decisions[images] @ git+https://github.com/edgelesssys/privatemode-decisions@bf973b9cec3fec33b29130dd47fe1ddda8e6dd04"]
# The local arm. Heavy (torch + transformers, ~1.7 GB of weights on first
# use) and only needed for --arms all|laya, so it is not a base dependency.
laya = ["laya>=0.3.5", "torch>=2.2", "transformers>=4.48"]
# The calibration analysis (bench.calibration, bench.calibrate_report).
calibration = ["numpy>=1.26", "matplotlib>=3.8"]
dev = ["pytest>=8", "numpy>=1.26"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bench"]
